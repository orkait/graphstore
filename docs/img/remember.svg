<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .node { stroke:#64748b; stroke-width:1.5; }
      .q    { fill:#e0f2fe; }
      .src  { fill:#dbeafe; }
      .stage{ fill:#f1f5f9; }
      .fuse { fill:#fef3c7; }
      .out  { fill:#dcfce7; }
      .dash { stroke-dasharray:5 4; }
      .title { font-size:13px; font-weight:700; fill:#0f172a; }
      .sub   { font-size:11px; fill:#334155; }
      .edge  { stroke:#475569; stroke-width:1.5; fill:none; marker-end:url(#arr2); }
      .lbl   { font-size:11px; fill:#64748b; }
      .weight{ font-size:11px; font-weight:700; fill:#92400e; font-family:ui-monospace,Menlo,monospace; }
    </style>
  </defs>

  <!-- Query -->
  <rect x="60" y="20" width="840" height="48" rx="10" class="node q"/>
  <text x="480" y="50" text-anchor="middle" class="title">REMEMBER "European architecture" LIMIT 10</text>

  <!-- Stage 1: Gather (two sources) -->
  <rect x="80"  y="110" width="200" height="70" rx="10" class="node src"/>
  <text x="180" y="138" text-anchor="middle" class="title">Vector ANN</text>
  <text x="180" y="157" text-anchor="middle" class="sub">sentence cosine · usearch</text>

  <rect x="680" y="110" width="200" height="70" rx="10" class="node src"/>
  <text x="780" y="138" text-anchor="middle" class="title">BM25 FTS5</text>
  <text x="780" y="157" text-anchor="middle" class="sub">keyword · SQLite FTS5</text>

  <text x="480" y="148" text-anchor="middle" class="lbl">Stage 1 — Gather (union, capped adaptively)</text>

  <!-- Stage 2: Fuse -->
  <rect x="250" y="225" width="460" height="70" rx="10" class="node fuse"/>
  <text x="480" y="252" text-anchor="middle" class="title">Stage 2 — Fuse (weighted | rrf)</text>
  <text x="320" y="275" class="weight">vec 0.52</text>
  <text x="420" y="275" class="weight">bm25 0.25</text>
  <text x="530" y="275" class="weight">recency 0.15</text>
  <text x="660" y="275" class="weight">graph 0.08</text>

  <!-- Stage 3: Temporal -->
  <rect x="80"  y="335" width="200" height="60" rx="10" class="node stage"/>
  <text x="180" y="361" text-anchor="middle" class="title">Stage 3 — Temporal</text>
  <text x="180" y="380" text-anchor="middle" class="sub">AT-window filter</text>

  <!-- Stage 4: Rerank (optional, dashed) -->
  <rect x="340" y="335" width="200" height="60" rx="10" class="node stage dash"/>
  <text x="440" y="361" text-anchor="middle" class="title">Stage 4 — Rerank</text>
  <text x="440" y="380" text-anchor="middle" class="sub">optional · GGUF / ONNX</text>

  <!-- Stage 5: Nucleus (optional, dashed) -->
  <rect x="600" y="335" width="200" height="60" rx="10" class="node stage dash"/>
  <text x="700" y="361" text-anchor="middle" class="title">Stage 5 — Nucleus</text>
  <text x="700" y="380" text-anchor="middle" class="sub">optional · edge walk</text>

  <!-- Out -->
  <rect x="840" y="335" width="110" height="60" rx="10" class="node out"/>
  <text x="895" y="370" text-anchor="middle" class="title">Ranked</text>

  <!-- Edges -->
  <path class="edge" d="M280,44 L180,110"/>
  <path class="edge" d="M680,44 L780,110"/>
  <path class="edge" d="M180,180 Q180,205 350,225"/>
  <path class="edge" d="M780,180 Q780,205 610,225"/>
  <path class="edge" d="M380,295 Q380,320 180,335"/>
  <path class="edge" d="M440,295 L440,335"/>
  <path class="edge" d="M560,295 Q560,320 700,335"/>
  <path class="edge" d="M540,365 L600,365"/>
  <path class="edge" d="M800,365 L840,365"/>
</svg>
