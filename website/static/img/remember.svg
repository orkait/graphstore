<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .bg    { fill:#f8fafc; }
      .node  { fill:#ffffff; stroke-width:2; }
      .q     { stroke:#64748b; }
      .src   { stroke:#3b82f6; }
      .stage { stroke:#64748b; }
      .fuse  { stroke:#f59e0b; }
      .out   { stroke:#10b981; }
      .dash  { stroke-dasharray:6 4; }
      .title { font-size:13px; font-weight:700; fill:#0f172a; }
      .sub   { font-size:11px; fill:#475569; }
      .edge  { stroke:#64748b; stroke-width:1.5; fill:none; marker-end:url(#arr2); }
      .lbl   { font-size:11px; fill:#64748b; }
      .rolelabel { font-size:11px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; fill:#94a3b8; }
      .wlbl  { font-size:10px; font-weight:600; fill:#475569; }
      .wval  { font-size:11px; font-weight:700; fill:#92400e; font-family:ui-monospace,Menlo,monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="420" class="bg"/>

  <!-- Query -->
  <rect x="60" y="20" width="840" height="48" rx="10" class="node q"/>
  <text x="480" y="50" text-anchor="middle" class="title">REMEMBER "European architecture" LIMIT 10</text>

  <!-- Stage 1 header -->
  <text x="480" y="98" text-anchor="middle" class="rolelabel">stage 1 - gather (union, capped adaptively)</text>

  <!-- Gather sources -->
  <rect x="80"  y="112" width="200" height="70" rx="10" class="node src"/>
  <text x="180" y="140" text-anchor="middle" class="title">Vector ANN</text>
  <text x="180" y="159" text-anchor="middle" class="sub">sentence cosine · usearch</text>

  <rect x="680" y="112" width="200" height="70" rx="10" class="node src"/>
  <text x="780" y="140" text-anchor="middle" class="title">BM25 FTS5</text>
  <text x="780" y="159" text-anchor="middle" class="sub">keyword · SQLite FTS5</text>

  <!-- Stage 2: Fuse -->
  <rect x="250" y="225" width="460" height="70" rx="10" class="node fuse"/>
  <text x="480" y="250" text-anchor="middle" class="title">Stage 2 - Fuse (weighted | rrf)</text>
  <text x="290" y="275" class="wlbl">vec</text>
  <text x="315" y="275" class="wval">0.52</text>
  <text x="380" y="275" class="wlbl">bm25</text>
  <text x="415" y="275" class="wval">0.25</text>
  <text x="490" y="275" class="wlbl">recency</text>
  <text x="535" y="275" class="wval">0.15</text>
  <text x="620" y="275" class="wlbl">graph</text>
  <text x="655" y="275" class="wval">0.08</text>

  <!-- Stage 3 -->
  <rect x="60"  y="335" width="200" height="60" rx="10" class="node stage"/>
  <text x="160" y="361" text-anchor="middle" class="title">Stage 3 - Temporal</text>
  <text x="160" y="380" text-anchor="middle" class="sub">AT-window filter</text>

  <!-- Stage 4 (optional) -->
  <rect x="300" y="335" width="200" height="60" rx="10" class="node stage dash"/>
  <text x="400" y="361" text-anchor="middle" class="title">Stage 4 - Rerank</text>
  <text x="400" y="380" text-anchor="middle" class="sub">optional · GGUF / ONNX</text>

  <!-- Stage 5 (optional) -->
  <rect x="540" y="335" width="200" height="60" rx="10" class="node stage dash"/>
  <text x="640" y="361" text-anchor="middle" class="title">Stage 5 - Nucleus</text>
  <text x="640" y="380" text-anchor="middle" class="sub">optional · edge walk</text>

  <!-- Out -->
  <rect x="780" y="335" width="150" height="60" rx="10" class="node out"/>
  <text x="855" y="370" text-anchor="middle" class="title">Ranked nodes</text>

  <!-- Edges -->
  <path class="edge" d="M280,44 L180,112"/>
  <path class="edge" d="M680,44 L780,112"/>
  <path class="edge" d="M180,182 Q180,205 350,225"/>
  <path class="edge" d="M780,182 Q780,205 610,225"/>
  <path class="edge" d="M380,295 Q340,320 180,335"/>
  <path class="edge" d="M460,295 L400,335"/>
  <path class="edge" d="M540,295 Q580,320 640,335"/>
  <path class="edge" d="M500,365 L540,365"/>
  <path class="edge" d="M740,365 L780,365"/>
</svg>
